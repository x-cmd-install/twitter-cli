{"id":461405259,"author":{"login":"jackwener","id":30525741,"node_id":"MDQ6VXNlcjMwNTI1NzQx","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDORe9Fcs4bgHxL","tag_name":"v0.9.0","target_commitish":"main","name":"v0.9.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-28T08:15:25Z","updated_at":"2026-11-28T08:17:05Z","published_at":"2026-11-28T08:17:05Z","assets":[],"body":"## Highlights\n\nMajor release consolidating 30 community PRs, 21 issue fixes, and x.com resilience updates (#106), plus April 2026 API schema and cursor pagination improvements since `v0.8.5`.\n\n### X.com Resilience & Security\n- **ClientTransaction bootstrap fix**: Authenticates against `https://x.com/home` with fallback to unauthenticated `https://x.com/i/jf/` (working around X's stripped `x-web` shell) without leaking session cookies to CDN script fetches.\n- **Query ID resilience**: Refreshed `FALLBACK_QUERY_IDS`, added 24h owner-only disk cache (`~/.twitter-cli/query_ids_cache.json`), `TWITTER_QID_<OP>` overrides, and automatic retry on stale query IDs (`HTTP 404/422`, `Query: Unspecified`, `PersistedQueryNotFound`).\n- **Fail-closed unsigned mutations**: Blocks unsigned GraphQL `POST` mutations unless `TWITTER_ALLOW_UNSIGNED=1` is set; prefers `chrome136` TLS impersonation.\n- **Dependencies & permissions**: Upgraded `curl_cffi>=0.15.0` (fixes GHSA-qw2m-4pqf-rmpp / CVE-2026-33752) and `xclienttransaction>=1.0.3`; enforced owner-only (`0o700`/`0o600`) atomic cache files.\n\n### Authentication\n- Added `TWITTER_COOKIE_STRING` env var for full browser `Cookie:` headers.\n- Added `TWITTER_CHROMIUM_USER_DATA_DIR`, Vivaldi, and Zen browser cookie extraction (macOS / Linux / Flatpak / Windows).\n- Improved Windows Chrome/Edge >=127 App-Bound Encryption diagnostics.\n\n### CLI, Config & Publishing\n- **Video & long-form publishing**: Chunked video upload (`--video` / `-V` on `post`, `reply`, `quote`, MP4/MOV/WebM up to 512 MB), twitter-text v3 weighted length + automatic `CreateNoteTweet` routing for Premium long-form posts (>280 weighted chars), and `twitter article-publish <file.md> --title ... [--draft]`.\n- **New commands**: `twitter news`, `twitter doctor [--refresh]`, and `twitter completion bash|zsh|fish`.\n- **Pagination, time & config**: Cursor pagination for feed (#49), lists (#56), tweets, and bookmarks; `--max` honors explicit values up to 10,000; `--time relative|absolute|iso`; user config at `~/.twitter-cli/config.yaml`.\n\n### Rich Metadata, Articles & Python API\n- **Python library API**: Public exports from `twitter_cli` (`TwitterClient`, `get_cookies`, `load_config`, `filter_tweets`, models, exceptions, serializers).\n- **Richer tweet/user/media data**: Author follower/following counts, `viewerFollowing`/`viewerFollowedBy`, sensitivity/content warnings, media `posterUrl`/`altText`/`durationMs`, thread reply/conversation IDs, numeric user ID routing (`UserByRestId`), and `TweetDetail` focal-tweet validation.\n- **Articles**: Inline hyperlinks (#44), inline images (#38), atomic markdown blocks (#37), `MARKDOWN`/`DIVIDER`/`TWEET` blocks, and subscriber-only tweet detection (#33).\n\n**Full Changelog**: https://github.com/public-clis/twitter-cli/compare/v0.8.5...v0.9.0"}
